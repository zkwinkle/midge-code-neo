# General
CONFIG_STD_C23=y
CONFIG_GNU_C_EXTENSIONS=y
CONFIG_DEBUG=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048
#CONFIG_MISRA_SANE=y
#CONFIG_CODING_GUIDELINE_CHECK=y
#CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_ZEPHYR_NUS=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="MidgeBadge"
CONFIG_BT_MAX_CONN=1

# Audio
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

# Battery charge
CONFIG_GPIO=y
CONFIG_ADC=y

# SDMMC
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
# need to add to doc
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_NUM_FILES=5

# Mover a un overlay de conf (?)
CONFIG_DISK_DRIVER_SDMMC=y
CONFIG_SPI=y
CONFIG_BOOTLOADER_MCUBOOT=n

#CONFIG_TIMESLICE_SIZE=5
CONFIG_TIMESLICING=y
CONFIG_MAIN_THREAD_PRIORITY=0
#CONFIG_SCHED_SIMPLE=y

# callbacks command
CONFIG_BT_RX_STACK_SIZE=4096
